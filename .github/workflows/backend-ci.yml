name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_allocation
          POSTGRES_USER: allocation
          POSTGRES_PASSWORD: allocation_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allocation -d project_allocation"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/project_allocation
      DB_USERNAME: allocation
      DB_PASSWORD: allocation_dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify
