server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-project-allocation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_allocation}
    username: ${DB_USERNAME:allocation}
    password: ${DB_PASSWORD:allocation_dev}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    in.krishchay.allocation: INFO

# Local classroom demo accounts. Override these values before sharing a deployed instance.
demo:
  admin:
    name: ${DEMO_ADMIN_NAME:Demo Administrator}
    email: ${DEMO_ADMIN_EMAIL:admin@college.local}
    password: ${DEMO_ADMIN_PASSWORD:Admin@12345}
  faculty:
    name: ${DEMO_FACULTY_NAME:Demo Faculty}
    email: ${DEMO_FACULTY_EMAIL:faculty@college.local}
    password: ${DEMO_FACULTY_PASSWORD:Faculty@12345}
