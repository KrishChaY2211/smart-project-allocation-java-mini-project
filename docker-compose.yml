services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: smart-project-allocation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_allocation
      POSTGRES_USER: allocation
      POSTGRES_PASSWORD: allocation_dev
    ports:
      - "5432:5432"
    volumes:
      - allocation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocation -d project_allocation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  allocation_postgres_data:
